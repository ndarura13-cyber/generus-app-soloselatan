<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan | PPG Solo Selatan</title>
  <link rel="icon" type="image/png" href="/src/image/appicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #080d1a;
      --navy-deep: #0a1428;
      --royal-blue: #1a56c4;
      --gold-accent: #f59e0b;
      --gold-light: #fbbf24;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --tier-1-color: #141f35;
      --tier-2-color: #24416e;
      --tier-3-color: #e2eeff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(26, 86, 196, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(10, 20, 40, 0.8) 0%, var(--bg-dark) 100%);
    }

    /* Subtle Film Grain Texture Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.035;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 3.5rem 3.5rem 1rem 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Top-Left Badge */
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      user-select: none;
      margin-bottom: 2.2rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-accent), 0 0 16px rgba(245, 158, 11, 0.5);
      animation: pulseGold 2.5s infinite ease-in-out;
    }

    @keyframes pulseGold {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
        box-shadow: 0 0 8px var(--gold-accent);
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
        box-shadow: 0 0 14px var(--gold-light), 0 0 22px rgba(245, 158, 11, 0.6);
      }
    }

    /* Main Typography */
    .error-title {
      font-size: clamp(2.2rem, 4.4vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--text-white);
      max-width: 580px;
      margin-bottom: 2.5rem;
    }

    /* Action Button ("Return home ↗") */
    .btn-return-home {
      display: inline-flex;
      align-items: flex-start;
      justify-content: space-between;
      min-width: 146px;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .btn-return-home .btn-text {
      padding-right: 1.2rem;
    }

    .btn-return-home .btn-icon {
      font-size: 0.95rem;
      line-height: 1;
      color: var(--text-muted);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .btn-return-home:hover {
      background: rgba(26, 86, 196, 0.2);
      border-color: rgba(245, 158, 11, 0.55);
      color: #ffffff;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.2), 0 8px 20px rgba(0, 0, 0, 0.4);
      transform: translateY(-2px);
    }

    .btn-return-home:hover .btn-icon {
      color: var(--gold-light);
      transform: translate(2px, -2px);
    }

    .btn-return-home:active {
      transform: translateY(0);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
    }

    /* Massive 3-Tier Stacked 404 Artwork */
    .artwork-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      line-height: 0;
      margin-top: auto;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .artwork-svg {
      width: 100%;
      height: auto;
      max-height: 52vh;
      display: block;
      transform: translateY(12%);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      .content-wrapper {
        padding: 2.2rem 1.6rem 1rem 1.6rem;
      }

      .error-badge {
        font-size: 0.68rem;
        margin-bottom: 1.8rem;
        letter-spacing: 0.14em;
      }

      .error-title {
        font-size: clamp(1.85rem, 6.5vw, 2.35rem);
        line-height: 1.2;
        max-width: 340px;
        margin-bottom: 2rem;
      }

      .btn-return-home {
        min-width: 140px;
        padding: 0.9rem 1.15rem;
        font-size: 0.92rem;
      }

      .artwork-svg {
        max-height: 44vh;
        transform: translateY(14%);
      }
    }

    @media (max-width: 480px) {
      .content-wrapper {
        padding: 1.8rem 1.25rem 0.5rem 1.25rem;
      }

      .error-title {
        font-size: 1.85rem;
        max-width: 320px;
      }

      .artwork-svg {
        max-height: 40vh;
        transform: translateY(16%);
      }
    }
  </style>
</head>
<body>

  <!-- Top Content (Badge, Heading, Home Button) -->
  <main class="content-wrapper">
    <div class="error-badge">
      <span class="badge-dot" aria-hidden="true"></span>
      <span>404 ERROR. PAGE NOT FOUND</span>
    </div>

    <h1 class="error-title">
      If you&rsquo;re reading this, something has gone terribly, terribly wrong.
    </h1>

    <a href="/index.html" class="btn-return-home" id="btnReturnHome">
      <span class="btn-text">Return home</span>
      <span class="btn-icon" aria-hidden="true">&#x2197;</span>
    </a>
  </main>

  <!-- 3-Tier Stacked 404 Typography Graphic -->
  <div class="artwork-container" aria-hidden="true">
    <svg 
      class="artwork-svg"
      viewBox="0 0 1600 640" 
      preserveAspectRatio="xMidYMax slice" 
      xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Reusable 404 Base Geometry -->
        <g id="glyph-404">
          <!-- Left 4: Sharp chevron cuts on left, solid right stem -->
          <path fill-rule="evenodd" d="
            M 250 0 
            L 400 0 
            L 400 480 
            L 260 480 
            L 260 360 
            L 0 360 
            L 240 160 
            L 80 160 
            L 250 0 Z 
            M 260 210 
            L 90 350 
            L 260 350 Z" />

          <!-- Center 0: Smooth stadium / pill geometry with concentric counter -->
          <path fill-rule="evenodd" d="
            M 580 0 
            L 1020 0 
            A 160 160 0 0 1 1180 160 
            L 1180 320 
            A 160 160 0 0 1 1020 480 
            L 580 480 
            A 160 160 0 0 1 420 320 
            L 420 160 
            A 160 160 0 0 1 580 0 Z 
            M 600 110 
            L 1000 110 
            A 70 70 0 0 1 1070 180 
            L 1070 300 
            A 70 70 0 0 1 1000 370 
            L 600 370 
            A 70 70 0 0 1 530 300 
            L 530 180 
            A 70 70 0 0 1 600 110 Z" />

          <!-- Right 4: Identical right counterpart -->
          <path fill-rule="evenodd" d="
            M 1450 0 
            L 1600 0 
            L 1600 480 
            L 1460 480 
            L 1460 360 
            L 1200 360 
            L 1440 160 
            L 1280 160 
            L 1450 0 Z 
            M 1460 210 
            L 1290 350 
            L 1460 350 Z" />
        </g>

        <!-- Linear gradient for Tier 3 foreground with subtle gold & ice-blue reflection -->
        <linearGradient id="tier3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f0f6ff" />
          <stop offset="70%" stop-color="#dbeafe" />
          <stop offset="100%" stop-color="#bfdbfe" />
        </linearGradient>
      </defs>

      <!-- Tier 1: Deep Navy Slate (Top / Furthest Back) -->
      <use href="#glyph-404" transform="translate(0, 20)" fill="var(--tier-1-color)" opacity="0.42" />

      <!-- Tier 2: Royal Blue Medium Tone (Middle) -->
      <use href="#glyph-404" transform="translate(0, 110)" fill="var(--tier-2-color)" opacity="0.78" />

      <!-- Tier 3: Icy Blue Luminous Foreground (Front / Anchored to Bottom) -->
      <use href="#glyph-404" transform="translate(0, 200)" fill="url(#tier3Gradient)" />
    </svg>
  </div>

  <script>
    // Safeguard: Make Return Home button resilient in both root and sub-path deployments
    document.getElementById('btnReturnHome')?.addEventListener('click', function(e) {
      // In PWA or offline environments, smooth navigate to /index.html
      if (window.location.pathname.endsWith('/404.html') || window.location.pathname.endsWith('/404')) {
        // Normal navigation
      }
    });
  </script>
</body>
</html>
